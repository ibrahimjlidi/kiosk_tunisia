version: '3.9'
services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kiosk-backend-prod
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/fuelstation_erp
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - '5000:5000'
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - kiosk-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kiosk-frontend-prod
    restart: unless-stopped
    ports:
      - '8081:80'
    depends_on:
      - backend
    networks:
      - kiosk-network

  mongo:
    image: mongo:6.0
    container_name: kiosk-mongo-prod
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - '27018:27017'
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand(\"ping\").ok" | grep -q 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kiosk-network

  mysql:
    image: mysql:8.4
    container_name: kiosk-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in server/.env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in server/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in server/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the environment}
    volumes:
      - mysql-data-prod:/var/lib/mysql
    ports:
      - '3307:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - kiosk-network

volumes:
  mongo-data:
  mysql-data-prod:
    name: kiosk-mysql-data-prod

networks:
  kiosk-network:
    driver: bridge
